name: Syntrophe - Bible Study Partner
description: A premium offline-first Android Bible study companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  
  # Local Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Video/Audio
  video_player: ^2.8.2
  chewie: ^1.7.4
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # Speech-to-Text
  speech_to_text: ^6.6.0
  
  # Notifications & Alarms
  flutter_local_notifications: ^16.3.2
  android_alarm_manager_plus: ^3.0.4
  
  # UI/UX
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_markdown: ^0.6.18
  
  # Utilities
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  intl: ^0.18.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  drift_dev: ^2.15.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  fonts:
    - family: Crimson_Text
      fonts:
        - asset: fonts/CrimsonText-Regular.ttf
        - asset: fonts/CrimsonText-Bold.ttf
          weight: 700
        - asset: fonts/CrimsonText-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-Medium.ttf
          weight: 500
